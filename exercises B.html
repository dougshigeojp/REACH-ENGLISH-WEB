<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Exercises | English Block Assembling</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ============================================================
         SESSION CONFIGURATOR MODAL (Paste this block at the top of <body>)
         Appears on load. Lets students pick an exercise playlist.
         ============================================================ -->
    <div id="session-configurator-overlay">
        <div id="session-configurator-modal" role="dialog" aria-labelledby="sc-title" aria-modal="true">

            <!-- Modal Header -->
            <div class="sc-header">
                <div class="sc-icon">🏋️</div>
                <h2 id="sc-title" class="sc-title">Session Configurator</h2>
                <p class="sc-subtitle">Choose your workout before diving in.</p>
            </div>

            <!-- Tab Navigation -->
            <div class="sc-tabs" role="tablist">
                <button class="sc-tab active" role="tab" aria-selected="true" aria-controls="sc-panel-time" id="sc-tab-time" onclick="switchConfigTab('time')">⏱ By Time</button>
                <button class="sc-tab" role="tab" aria-selected="false" aria-controls="sc-panel-category" id="sc-tab-category" onclick="switchConfigTab('category')">📚 By Category</button>
                <button class="sc-tab" role="tab" aria-selected="false" aria-controls="sc-panel-custom" id="sc-tab-custom" onclick="switchConfigTab('custom')">🛠 Custom</button>
            </div>

            <!-- Tab Panel: By Time -->
            <div class="sc-panel active" id="sc-panel-time" role="tabpanel" aria-labelledby="sc-tab-time">
                <div class="sc-radio-group">
                    <label class="sc-radio-card" onclick="selectPreset('time', this)">
                        <input type="radio" name="sc-time" value="complete" hidden>
                        <span class="sc-radio-dot"></span>
                        <div class="sc-radio-info">
                            <strong>Complete Session</strong>
                            <span class="sc-badge sc-badge-time">~33 min</span>
                        </div>
                        <p class="sc-radio-desc">All 15 exercises — the full experience.</p>
                    </label>
                    <label class="sc-radio-card" onclick="selectPreset('time', this)">
                        <input type="radio" name="sc-time" value="quick" hidden>
                        <span class="sc-radio-dot"></span>
                        <div class="sc-radio-info">
                            <strong>Quick Practice</strong>
                            <span class="sc-badge sc-badge-time">~3 min</span>
                        </div>
                        <p class="sc-radio-desc">3 focused drills for a rapid review.</p>
                    </label>
                    <label class="sc-radio-card" onclick="selectPreset('time', this)">
                        <input type="radio" name="sc-time" value="homework" hidden>
                        <span class="sc-radio-dot"></span>
                        <div class="sc-radio-info">
                            <strong>Homework Track</strong>
                            <span class="sc-badge sc-badge-time">~13 min</span>
                        </div>
                        <p class="sc-radio-desc">5 exercises across different skill areas.</p>
                    </label>
                    <label class="sc-radio-card" onclick="selectPreset('time', this)">
                        <input type="radio" name="sc-time" value="mock" hidden>
                        <span class="sc-radio-dot"></span>
                        <div class="sc-radio-info">
                            <strong>Mock Test</strong>
                            <span class="sc-badge sc-badge-time">~17.5 min</span>
                        </div>
                        <p class="sc-radio-desc">7 exercises simulating exam conditions.</p>
                    </label>
                </div>
                <button class="sc-launch-btn" id="sc-launch-time" disabled onclick="launchSession('time')">Select a playlist above</button>
            </div>

            <!-- Tab Panel: By Category -->
            <div class="sc-panel" id="sc-panel-category" role="tabpanel" aria-labelledby="sc-tab-category">
                <div class="sc-radio-group">
                    <label class="sc-radio-card" onclick="selectPreset('category', this)">
                        <input type="radio" name="sc-category" value="receptive" hidden>
                        <span class="sc-radio-dot"></span>
                        <div class="sc-radio-info">
                            <strong>Identification & Sorting</strong>
                            <span class="sc-badge sc-badge-cat">Receptive Logic</span>
                        </div>
                        <p class="sc-radio-desc">Pages 1, 3, 4, 5 — recognize and classify blocks.</p>
                    </label>
                    <label class="sc-radio-card" onclick="selectPreset('category', this)">
                        <input type="radio" name="sc-category" value="structural" hidden>
                        <span class="sc-radio-dot"></span>
                        <div class="sc-radio-info">
                            <strong>Assembly & Mechanics</strong>
                            <span class="sc-badge sc-badge-cat">Structural Logic</span>
                        </div>
                        <p class="sc-radio-desc">Pages 2, 6, 9, 10 — build and arrange blocks.</p>
                    </label>
                    <label class="sc-radio-card" onclick="selectPreset('category', this)">
                        <input type="radio" name="sc-category" value="acoustic" hidden>
                        <span class="sc-radio-dot"></span>
                        <div class="sc-radio-info">
                            <strong>Phonetics & Prosody</strong>
                            <span class="sc-badge sc-badge-cat">Acoustic/Motor Logic</span>
                        </div>
                        <p class="sc-radio-desc">Pages 11, 12, 13 — master rhythm and sound.</p>
                    </label>
                    <label class="sc-radio-card" onclick="selectPreset('category', this)">
                        <input type="radio" name="sc-category" value="generative" hidden>
                        <span class="sc-radio-dot"></span>
                        <div class="sc-radio-info">
                            <strong>Free Production & Application</strong>
                            <span class="sc-badge sc-badge-cat">Generative Logic</span>
                        </div>
                        <p class="sc-radio-desc">Pages 7, 8, 14, 15 — create original output.</p>
                    </label>
                </div>
                <button class="sc-launch-btn" id="sc-launch-category" disabled onclick="launchSession('category')">Select a category above</button>
            </div>

            <!-- Tab Panel: Custom -->
            <div class="sc-panel" id="sc-panel-custom" role="tabpanel" aria-labelledby="sc-tab-custom">
                <div class="sc-custom-header">
                    <span class="sc-custom-count" id="sc-custom-count">0 selected</span>
                    <button class="sc-toggle-all-btn" id="sc-toggle-all" onclick="toggleAllCustom()">Select All</button>
                </div>
                <div class="sc-checkbox-list" id="sc-checkbox-list">
                    <!-- JS will populate these 15 checkboxes -->
                </div>
                <button class="sc-launch-btn" id="sc-launch-custom" disabled onclick="launchSession('custom')">Launch Custom Session</button>
            </div>

        </div><!-- /.sc-modal -->
    </div><!-- /.sc-overlay -->

    <!-- STICKY METADATA HEADER -->
<header id="metadata-header">
    <!-- SWITCHER BUTTON (Left side) -->
    <a href="index.html?lesson=home" class="mode-switch-btn" title="Go to Course">
        🏠 COURSE
    </a>

    <div class="header-content">
        <span id="display-block" style="color:var(--accent-red); font-weight:900;">EXERCISES</span> • 
        <span id="display-topic">PRACTICE PORTAL</span>
    </div>
</header>

    <!-- RETRACTABLE MENU -->
    <button id="menu-toggle" aria-label="Toggle Menu">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </button>

    <nav id="slide-menu">
        <div class="compact-nav-row">
            <a href="index.html?lesson=home" class="home-link">🏠 HOME</a>
            <a href="exercises.html?id=ex-home" class="home-link">🏋️ PRACTICE</a>
        </div>
        <div class="menu-header">
            <div class="menu-logo"><span class="red-text">ENGLISH</span> Block Assembling</div>
            <div id="menu-block-label">PRACTICE</div>
            <div id="menu-topic-label">Exercises</div>
        </div>
        <ul id="nav-list"></ul>
    </nav>

    <!-- MAIN CONTENT -->
    <main id="main-container">
        <div id="lesson-content">
            <div class="loader-container" style="text-align: center; padding-top: 50px;">
                <div class="loader">Loading Exercises...</div>
            </div>
        </div>
    </main>

    <!-- NAVIGATION UI -->
    <div id="ui-cluster">
        <div class="nav-buttons">
            <button id="prev-btn" class="nav-arrow" disabled>←</button>
            <button id="next-btn" class="nav-arrow">→</button>
        </div>
    </div>

    <audio id="global-audio-player"></audio>
    <div id="tooltip-container" class="tooltip-box"></div>

    <script src="engine-exercises.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const lessonId = urlParams.get('id');
        const contentDiv = document.getElementById('lesson-content');

        if (!lessonId) {
            contentDiv.innerHTML = `<div style="text-align:center; padding:50px;"><h2>Setup Required</h2><p>Missing ID.</p></div>`;
        } else {
            const dataScript = document.createElement('script');
            dataScript.src = `data/exercises/${lessonId}.js`;
            dataScript.onerror = () => { contentDiv.innerHTML = `<h3>❌ Error: File Not Found</h3>`; };
            document.head.appendChild(dataScript);
        }
    </script>
</body>
</html>
